<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TV-AudioRemover</title>
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #ffffff 0%, #f7f7f7 100%);
      color: #111;
    }

    .container {
      width: min(1200px, calc(100vw - 48px));
      padding: 56px 32px;
      text-align: center;
    }

    .title-card {
      background: #fff;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
      padding: 64px 40px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.6rem);
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .accent {
      display: block;
      width: 96px;
      height: 4px;
      margin: 0 auto 28px;
      border-radius: 999px;
      background: linear-gradient(90deg, #c8b0a0, #e1d0c5);
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="title-card">
      <span class="accent"></span>
      <h1>TV-AudioRemover: Joint Text‑Visual Guided Sound Removal with Multi‑Task Hard‑Mixture Curriculum</h1>
    </section>
  </main>
</body>
</html>
